<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos OEM</title>
<link rel="stylesheet" href="styles.css?v=32">
</head>
<body>

<div class="app">

  <!-- ===================== Menú lateral ===================== -->
  <aside class="sidebar" data-name="Menu lateral">

    <div class="sidebar-top">
      <div class="sidebar-logo">
        <img src="assets/logo-apymsa.png" alt="Logo Apymsa">
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">
          <span>Gestión</span>
        </div>

        <div class="nav-group">
          <div class="nav-item--active">
            <span>Productos OEM</span>
          </div>
        </div>

      </nav>
    </div>

    <div class="sidebar-footer">
      <span>© 2026 - Administrador  operaciones</span>
      <span>Versión 3.0.0.8</span>
    </div>
  </aside>

  <!-- ===================== Contenido ===================== -->
  <main class="content">

    <div class="content-header">
      <h1>Productos OEM</h1>
      <div class="logout">
        <svg width="12" height="13" viewBox="0 0 12 13" fill="rgb(0,0,0)" aria-hidden="true">
          <circle cx="6" cy="3.6" r="3.1"></circle>
          <path d="M6 8.1 C 2.9 8.1 0.6 9.9 0.6 12.2 C 0.6 12.6 0.9 12.9 1.3 12.9 L 10.7 12.9 C 11.1 12.9 11.4 12.6 11.4 12.2 C 11.4 9.9 9.1 8.1 6 8.1 Z" fill-rule="nonzero"></path>
        </svg>
        <span>Cerrar sesión</span>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn--primary" id="btnExportar" title="Descargar la tabla en formato Excel (.xlsx)">Exportar</button>
      <button type="button" class="btn btn--primary" id="btnImportar"
              title="Cargar equivalencias desde un archivo de Excel">Importar</button>
      <button type="button" class="btn btn--success" id="btnPlantilla" title="Descargar la plantilla de carga en formato Excel (.xlsx)">Descargar plantilla</button>
      <div class="actions__end">
        <button type="button" class="btn btn--primary" id="btnBitacora"
                title="Consultar el historial de cambios de las equivalencias">Bitácora</button>
        <button type="button" class="btn btn--primary" id="btnEquivalencia">Agregar equivalencia +</button>
      </div>
    </div>

    <div class="filters">
      <div class="filter-field">
        <label for="selTipo">Tipo:</label>
        <div class="select select--tipo" id="selTipo" data-options="Todos|GS1|No GS1"></div>
      </div>

      <div class="filter-field">
        <label for="selAlcance">Alcance:</label>
        <div class="select select--alcance" id="selAlcance"
             data-options="Todos|Producto|Presentación"></div>
      </div>

      <div class="filter-field">
        <label for="selEstatus">Estatus:</label>
        <div class="select select--estatus" id="selEstatus"
             data-options="Todos|Activo|Inactivo"></div>
      </div>

      <button type="button" class="btn btn--filter" id="btnFiltrar" disabled
              title="Cambia algún filtro para poder aplicarlo">Filtrar</button>

      <div class="pagination" id="pagination"></div>
    </div>

    <div class="table-wrapper">
      <div class="table" id="table"></div>
    </div>

    <div class="footer-bar">
      <label for="selRows">Registros por página:</label>
      <div class="select select--rows select--up" id="selRows" data-options="25|50|75|100"></div>
    </div>
  </main>
</div>

<script src="xlsx.js?v=32"></script>
<script src="xlsx-read.js?v=32"></script>
<script src="toast.js?v=32"></script>
<script src="modal.js?v=32"></script>
<script src="app.js?v=32"></script>
</body>
</html>
